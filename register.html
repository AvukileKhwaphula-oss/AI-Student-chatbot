<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - CPUT Student Support</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="signin-overlay">

        <div class="signin-box">

            <div class="signin-logo">
                🎓
            </div>

            <h2>Create Student Account</h2>

            <p class="signin-text">
                Create your account to access CPUT Student Support.
            </p>


            <label for="registerStudentNumber">
                Student Number
            </label>

            <input
                type="text"
                id="registerStudentNumber"
                placeholder="Enter your student number"
            >


            <label for="registerEmail">
                Student Email
            </label>

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email address"
            >


            <label for="registerPassword">
                Password
            </label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Create a password"
            >


            <label for="registerConfirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="registerConfirmPassword"
                placeholder="Confirm your password"
            >


            <button
                class="signin-button"
                id="registerButton"
            >
                Create Account
            </button>


            <p id="registerMessage"></p>

            <p class="demo-text">

                Already have an account?

                <a href="index.html">
                    Sign In
                </a>

            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UniBot - Forgot Password</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="password-page">

        <div class="password-card">

            <div class="password-icon">
                🔐
            </div>

            <h1>Forgot Password?</h1>

            <p>
                Enter your student email address or student number
                to reset your password.
            </p>


            <form id="forgotPasswordForm">

                <label for="studentIdentifier">
                    Student Email / Student Number
                </label>

                <input
                    type="text"
                    id="studentIdentifier"
                    placeholder="Enter your email or student number"
                    required
                >


                <button type="submit">
                    Continue
                </button>

            </form>


            <a href="index.html" class="back-login">
                ← Back to Sign In
            </a>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
